<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculator UI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <section class="calculator" aria-label="Calculator">
      <div class="screen" aria-live="polite">
        <div class="screen-label">Calculator</div>
        {% if error %}
          <div class="display error">{{ error }}</div>
        {% elif result is not none %}
          <div class="display">{{ result }}</div>
        {% else %}
          <div class="display">0</div>
        {% endif %}
      </div>

      <form id="calculator-form" method="post" class="calculator-form">
        <div class="field-row">
          <label>
            <span>Value A</span>
            <input name="a" type="number" step="any" value="{{ a }}" placeholder="0" required>
          </label>
          <label>
            <span>Value B</span>
            <input name="b" type="number" step="any" value="{{ b }}" placeholder="0" required>
          </label>
        </div>

        <div class="operation-grid" aria-label="Operation selector">
          {% for key, (sym, _) in operations.items() %}
            <label class="operation-option {% if key == op_key %}active{% endif %}">
              <input type="radio" name="operation" value="{{ key }}" {% if key == op_key %}checked{% endif %}>
              <span>{{ sym }}</span>
            </label>
          {% endfor %}
        </div>

        <div class="actions">
          <button type="submit" class="primary">Calculate</button>
          <button type="button" id="reset-button" class="secondary">Reset</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById('calculator-form');
    const display = document.querySelector('.display');
    const resetButton = document.getElementById('reset-button');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const payload = Object.fromEntries(new FormData(form).entries());
      const response = await fetch('/api/calculate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const data = await response.json();
      if (!response.ok) {
        display.textContent = data.error || 'Unable to calculate.';
        display.classList.add('error');
        return;
      }

      display.textContent = data.result;
      display.classList.remove('error');
    });

    resetButton.addEventListener('click', () => {
      form.reset();
      document.querySelector('input[name="a"]').value = '';
      document.querySelector('input[name="b"]').value = '';
      document.querySelector('input[name="operation"][value="add"]').checked = true;
      display.textContent = '0';
      display.classList.remove('error');
    });
  </script>
</body>
</html>
